<!-- src/app/app.components.html -->

<nav class="navbar">
  <a class="logo" routerLink="/">
    <i class="fas fa-home"></i> FincaRen
  </a>

  <ul class="nav-links">
    <li>
      <a routerLink="/arriendos" routerLinkActive="active">Rent</a>
    </li>

    <!-- si hay un usuario logueado, checamos rol -->
    <ng-container *ngIf="usuario$ | async as usuario">
      <!-- Solo Arrendador ve “Manage Property” -->
      <li *ngIf="usuario.rol === 'ARRENDADOR'">
        <a routerLink="/propiedades" routerLinkActive="active">Manage Property</a>
      </li>

      <li *ngIf="usuario.rol === 'ARRENDATARIO'">
        <a routerLink="/arriendos/solicitudes" routerLinkActive="active">Ver Solicitudes de Arriendo</a>
      </li>
    </ng-container>
  </ul>

  <div class="nav-buttons">
    <ng-container *ngIf="(usuario$ | async) as usuario; else mostrarLoginSignUp">
      <!-- Usuario logueado: saludo y botón Logout -->
      <span class="bienvenido">Bienvenido, {{ usuario.nombre }}</span>
      <button class="btn logout" (click)="logout()">Logout</button>
    </ng-container>

    <ng-template #mostrarLoginSignUp>
      <a class="btn login" routerLink="/login">Login</a>
      <a class="btn signup" routerLink="/registro">Sign up</a>
    </ng-template>
  </div>
</nav>

<router-outlet></router-outlet>
