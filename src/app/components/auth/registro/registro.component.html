<div class="signup-container">
  <div class="signup-header">
    <h1>Gane más con su propiedad, haga menos</h1>
    <h2>Registro</h2>
  </div>

  <div class="signup-content">
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="signup-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" placeholder="John" formControlName="nombre" />
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" placeholder="Doe" formControlName="apellido" />
        </div>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" placeholder="1 234 567 890" formControlName="telefono" />
      </div>

      <div class="form-group">
        <label for="email">Correo</label>
        <input id="email" type="email" placeholder="john@example.com" formControlName="email" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••" formControlName="password" />
      </div>

      <div class="form-group">
        <label for="rol">Rol</label>
        <select id="rol" formControlName="rol">
          <option value="" disabled selected>Selecciona tu rol</option>
          <option value="ARRENDADOR">Arrendador</option>
          <option value="ARRENDATARIO">Arrendatario</option>
        </select>
      </div>

      <!-- Mensaje de error -->
      <div class="error" *ngIf="errorMsg">
        {{ errorMsg }}
      </div>

      <button type="submit" class="btn-submit">Crear Cuenta</button>
    </form>

    <div class="signup-image">
      <img src="assets/images/Casa.png" alt="Modern house with key" />
    </div>
  </div>
</div>
