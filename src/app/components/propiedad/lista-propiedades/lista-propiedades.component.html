<!-- src/app/components/propiedad/lista-propiedades/lista-propiedades.component.html -->

<div class="contenedor">
  <div class="encabezado">
    <h2>Propiedades Creadas</h2>
    <button class="btn-crear" [routerLink]="['/propiedades/nueva']">
      Crear propiedad
    </button>
  </div>

  <div class="grid">
    <div 
      class="tarjeta" 
      *ngFor="let propiedad of propiedades"
      [ngClass]="{ 'desactivada': propiedad.status === 'INACTIVA' }"
    >
      <!-- Si quieres, aquí podrías mostrar una imagen: <img [src]="propiedad.imagen" ...> -->

      <div class="info">
        <h3>\${{ propiedad.valorNoche }}<span>/noche</span></h3>
        <p class="titulo">
          {{ propiedad.nombre }}
          <!-- Mostramos una etiqueta “Desactivada” si su status es INACTIVA -->
          <span *ngIf="propiedad.status === 'INACTIVA'" class="badge-desactivada">
            (Desactivada)
          </span>
        </p>
        <p class="direccion">{{ propiedad.departamento }}, {{ propiedad.municipio }}</p>

        <div class="acciones">
          <!-- Botón “Ver” → navega a /propiedades/{id} -->
          <button class="btn-ver" (click)="verDetalle(propiedad.id)">
            Ver
          </button>
          <!-- Botón “Editar” → navega a /propiedades/{id}/editar -->
          <button class="btn-editar" (click)="editar(propiedad.id)">
            Editar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
