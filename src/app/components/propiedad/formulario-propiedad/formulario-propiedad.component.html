<main class="main-container">
  <section class="form-card">
    <div class="form-header">
      <h1>Crear Propiedad</h1>
      <p>Completa todos los campos para registrar una nueva propiedad.</p>
    </div>

    <form [formGroup]="propiedadForm" (ngSubmit)="guardarPropiedad()" class="property-form">

      <!-- Fila 1 -->
      <div class="form-row">
        <div class="form-group emoji-field">
          <label for="nombre">🏠 Nombre *</label>
          <input id="nombre" type="text" placeholder="Nombre de la propiedad" formControlName="nombre" />
        </div>

        <div class="form-group emoji-field">
          <label for="departamento">📍 Departamento *</label>
          <input id="departamento" type="text" placeholder="Departamento" formControlName="departamento" />
        </div>

        <div class="form-group emoji-field">
          <label for="municipio">📌 Municipio *</label>
          <input id="municipio" type="text" placeholder="Municipio" formControlName="municipio" />
        </div>
      </div>

      <!-- Fila 2 -->
      <div class="form-row">
        <div class="form-group full-width emoji-field">
          <label for="descripcion">💬 Descripción *</label>
          <textarea id="descripcion" rows="4" placeholder="Breve descripción" formControlName="descripcion"></textarea>
        </div>
      </div>

      <!-- Fila 3 -->
      <div class="form-row">
        <div class="form-group emoji-field">
          <label for="habitaciones">🛏️ Habitaciones *</label>
          <input id="habitaciones" type="number" min="1" placeholder="Cantidad de habitaciones" formControlName="habitaciones" />
        </div>

        <div class="form-group emoji-field">
          <label for="banos">🛁 Baños *</label>
          <input id="banos" type="number" min="1" placeholder="Cantidad de baños" formControlName="banos" />
        </div>

        <div class="form-group emoji-field">
          <label for="valorNoche">💰 Valor/Noche (COP) *</label>
          <input id="valorNoche" type="number" min="0.1" step="0.01" placeholder="Precio por noche" formControlName="valorNoche" />
        </div>
      </div>

      <!-- Fila 4 -->
      <div class="form-row">
        <div class="form-group emoji-field">
          <label for="tipoIngreso">🏷️ Tipo de Ingreso *</label>
          <select id="tipoIngreso" formControlName="tipoIngreso">
            <option value="" disabled>Selecciona una opción</option>
            <option *ngFor="let tipo of tiposIngreso" [value]="tipo.value">{{ tipo.label }}</option>
          </select>
        </div>

        <div class="form-group emoji-field">
          <label for="status">✔️ Estado *</label>
          <select id="status" formControlName="status">
            <option value="" disabled>Selecciona estado</option>
            <option *ngFor="let st of statuses" [value]="st.value">{{ st.label }}</option>
          </select>
        </div>
      </div>

      <!-- Fila 5 -->
      <div class="form-row">
        <div class="form-checkbox">
          <input type="checkbox" id="mascotas" formControlName="mascotas" />
          <label for="mascotas">🐶 Permite Mascotas</label>
        </div>
        <div class="form-checkbox">
          <input type="checkbox" id="piscina" formControlName="piscina" />
          <label for="piscina">🏊 Tiene Piscina</label>
        </div>
        <div class="form-checkbox">
          <input type="checkbox" id="asador" formControlName="asador" />
          <label for="asador">🔥 Tiene Asador</label>
        </div>
      </div>

      <!-- Botón -->
      <div class="form-row form-actions">
        <button type="submit" [disabled]="propiedadForm.invalid" class="submit-btn">
          Crear Propiedad
        </button>
      </div>
    </form>
  </section>
</main>
